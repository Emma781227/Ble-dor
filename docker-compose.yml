services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: bledor-web:latest
    container_name: bledor-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://bledor:bledor_password@db:5432/bledor_db?schema=public
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: change-me-in-prod
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    container_name: bledor-dbase
    restart: unless-stopped
    environment:
      POSTGRES_USER: bledor
      POSTGRES_PASSWORD: bledor_password
      POSTGRES_DB: bledor_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bledor -d bledor_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
